<!DOCTYPE html>
<html lang="en" data-theme="coffee">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access Required - Gullyfam Game</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.4.19/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center">
    <div class="card bg-base-100 shadow-xl max-w-sm">
        <div class="card-body">
            <h2 class="card-title text-2xl justify-center">Admin Access Required</h2>
            <p class="text-center text-base-content/70 mt-2">
                Please add the admin key to the URL:
            </p>
            <code class="bg-base-200 px-3 py-2 rounded text-center mt-4">
                /admin?key=YOUR_SECRET
            </code>
        </div>
    </div>
</body>
</html>
